name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: BmoreMedTech

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: BmoreMedTech

      - name: Checkout shared portal
        uses: actions/checkout@v7
        with:
          repository: juliancoy/OrgPortal
          path: OrgPortal

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            BmoreMedTech/package-lock.json
            OrgPortal/web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install shared ecosystem test dependencies
        working-directory: OrgPortal/web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Validate Worker bundle
        run: npm run deploy:dry-run

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]')) }}
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
