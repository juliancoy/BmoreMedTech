<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/assets/images/baltimore-medtech-logo-square.jpg" />
    <link rel="apple-touch-icon" href="/assets/images/baltimore-medtech-logo-square.jpg" />
    <title>Calendar | Baltimore MedTech</title>
    <meta
      name="description"
      content="Baltimore MedTech calendar of medically related events from the published Code Collective Baltimore calendar."
    />
    <script>
      (() => {
        const key = 'bmore-medtech.theme';
        const stored = (() => { try { return localStorage.getItem(key); } catch { return null; } })();
        const mode = stored === 'light' || stored === 'dark' ? stored : 'system';
        const resolved = mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/theme.js"></script>
    <script type="module" src="/assets/calendar.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,anim=false,background=white,quality=75,width=32,height=32/uploads/gx/e8fdf4fb-b1ba-4269-8e6f-38103e820ff9.png" alt="" />
        <span>Baltimore MedTech</span>
      </a>
      <nav aria-label="Primary navigation">
        <a aria-current="page" href="/calendar.html">Calendar</a>
        <a href="/map.html">Map</a>
        <a href="/taxonomy.html">MedTech Index</a>
        <div class="theme-control" role="group" aria-label="Color theme">
          <button class="theme-option" type="button" data-theme-mode="system" aria-label="Use system theme" aria-pressed="true" title="System theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button class="theme-option" type="button" data-theme-mode="light" aria-label="Use light theme" aria-pressed="false" title="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          </button>
          <button class="theme-option" type="button" data-theme-mode="dark" aria-label="Use dark theme" aria-pressed="false" title="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
          </button>
        </div>
        <a class="button" href="https://codecollective.us/p/?portalProfile=baltimore-medtech">Login</a>
      </nav>
    </header>

    <main class="calendar-page">
      <section class="page-heading">
        <p class="eyebrow">Medical calendar</p>
        <h1>Medically Related Events</h1>
        <p>
          Events are filtered from the already published Code Collective Baltimore calendar feed.
        </p>
      </section>

      <section class="event-list-section">
        <div class="section-title-row">
          <h2>Upcoming</h2>
          <span id="event-count"></span>
        </div>
        <div id="event-list" class="event-list"></div>
      </section>

      <section class="month-section">
        <div class="section-title-row">
          <h2>Monthly Overview</h2>
        </div>
        <section class="calendar-toolbar" aria-label="Calendar controls">
          <button id="prev-month" type="button" aria-label="Previous month">&lt;</button>
          <h3 id="month-label">Loading</h3>
          <button id="next-month" type="button" aria-label="Next month">&gt;</button>
        </section>

        <section class="calendar-shell" aria-live="polite">
          <div id="status" class="status">Loading medical events...</div>
          <div id="calendar-grid" class="calendar-grid" hidden></div>
        </section>
      </section>
    </main>
    <a class="social-link" href="https://chat.whatsapp.com/Fpsd3Ko6l7q0Fy8DEYxw8V" target="_blank" rel="noopener noreferrer" aria-label="Join Baltimore MedTech on WhatsApp" title="Join Baltimore MedTech on WhatsApp"><span class="social-button"><img src="/assets/images/whatsapp.webp" alt="" class="social-icon" /></span></a>
  </body>
</html>
