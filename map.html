<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical System Map | Baltimore MedTech</title>
    <meta
      name="description"
      content="Baltimore MedTech map of public hospital, health infrastructure, healthy housing, and medical-system risk layers for Baltimore and Maryland."
    />
    <script>
      (() => {
        const key = 'bmore-medtech.theme';
        const stored = (() => { try { return localStorage.getItem(key); } catch { return null; } })();
        const mode = stored === 'light' || stored === 'dark' ? stored : 'system';
        const resolved = mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : mode === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/theme.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script type="module" src="/assets/med-map.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,anim=false,background=white,quality=75,width=32,height=32/uploads/gx/e8fdf4fb-b1ba-4269-8e6f-38103e820ff9.png" alt="" />
        <span>Baltimore MedTech</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="/calendar.html">Calendar</a>
        <a aria-current="page" href="/map.html">Map</a>
        <a href="/taxonomy.html">MedTech Index</a>
        <div class="theme-control" role="group" aria-label="Color theme">
          <button class="theme-option" type="button" data-theme-mode="system" aria-label="Use system theme" aria-pressed="true" title="System theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button class="theme-option" type="button" data-theme-mode="light" aria-label="Use light theme" aria-pressed="false" title="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
          </button>
          <button class="theme-option" type="button" data-theme-mode="dark" aria-label="Use dark theme" aria-pressed="false" title="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
          </button>
        </div>
        <a class="button" href="https://codecollective.us/p/?portalProfile=baltimore-medtech">Login</a>
      </nav>
    </header>

    <main class="map-page">
      <section class="map-workbench" aria-label="Baltimore MedTech medical system map">
        <aside class="map-panel" aria-labelledby="map-title">
          <div class="map-panel-heading">
            <p class="eyebrow">Medical system map</p>
            <h1 id="map-title">Baltimore and Maryland Health Layers</h1>
          </div>

          <label class="map-field" for="region-select">Region
            <select id="region-select">
              <option value="baltimore-city" selected>Baltimore City</option>
              <option value="maryland">Maryland</option>
              <option value="state">Other U.S. state</option>
              <option value="us">United States</option>
              <option value="worldwide">Worldwide view</option>
            </select>
          </label>

          <label id="state-field" class="map-field" for="state-select" hidden>State
            <select id="state-select" aria-label="U.S. state"></select>
          </label>

          <label class="map-field" for="size-mode-select">Marker size
            <select id="size-mode-select">
              <option value="volume" selected>Capacity / activity volume</option>
              <option value="uniform">Uniform</option>
            </select>
          </label>

          <div id="layer-controls" class="map-layer-controls" aria-label="Medical map layers"></div>
          <div id="map-status" class="map-status" aria-live="polite">Loading map...</div>
        </aside>

        <section class="map-stage">
          <div id="medical-map" class="medical-map" role="region" aria-label="Interactive medical system map"></div>
        </section>

        <aside id="map-inspector" class="map-inspector" aria-live="polite" aria-label="Medical map feature inspector" data-inspector-state="idle">
          <button id="close-map-inspector" class="map-inspector-close" type="button" aria-label="Close pinned feature" hidden>x</button>
          <div id="map-inspector-content">
            <strong>Selected feature</strong>
            <p>Click an upcoming medical event, hospital, health program, healthy-housing site, or risk tract.</p>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
